<style>
  :root{
    --bg:#F1F4EF;--surface:#FFFFFF;--surface-2:#E9EEE6;--surface-3:#F6F8F3;
    --ink:#0F1E1C;--ink-soft:#3F514A;--muted:#69776F;--line:#D7E0D6;--line-strong:#BDC9BC;
    --brand:#2F8B34;--brand-ink:#1E6B26;--brand-soft:#E2F0DC;--deep:#0B3A3F;--deep-2:#0F4A50;
    --copper:#B4642E;--copper-soft:#F0DBC8;
    --ok:#2F8B34;--ok-soft:#DCEFD7;--warn:#B67A12;--warn-soft:#F6E7C4;--crit:#B23A2E;--crit-soft:#F4D8D2;--info:#206E8C;--info-soft:#D3E7EE;
    --sans:"Segoe UI","Helvetica Neue",system-ui,-apple-system,Roboto,Arial,sans-serif;
    --mono:"Cascadia Code","Cascadia Mono",Consolas,ui-monospace,monospace;
    --shadow:0 1px 2px rgba(11,58,63,.06),0 8px 26px rgba(11,58,63,.07);
    --shadow-lg:0 24px 60px rgba(11,58,63,.18);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#091514;--surface:#0F2321;--surface-2:#15302D;--surface-3:#0C1D1B;
      --ink:#E9F1EA;--ink-soft:#B6C6BD;--muted:#7E9088;--line:#22403C;--line-strong:#2F5450;
      --brand:#57BD4C;--brand-ink:#7ED073;--brand-soft:#16351F;--deep:#0B3A3F;--deep-2:#123F45;
      --copper:#D98A54;--copper-soft:#3A2415;
      --ok:#57BD4C;--ok-soft:#16351F;--warn:#D9A63C;--warn-soft:#3A2E10;--crit:#E0685A;--crit-soft:#3A1A15;--info:#4FA6C4;--info-soft:#0F2E38;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);--shadow-lg:0 24px 60px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="light"]{--bg:#F1F4EF;--surface:#FFFFFF;--surface-2:#E9EEE6;--surface-3:#F6F8F3;--ink:#0F1E1C;--ink-soft:#3F514A;--muted:#69776F;--line:#D7E0D6;--line-strong:#BDC9BC;--brand:#2F8B34;--brand-ink:#1E6B26;--brand-soft:#E2F0DC;--deep:#0B3A3F;--deep-2:#0F4A50;--copper:#B4642E;--copper-soft:#F0DBC8;--ok:#2F8B34;--ok-soft:#DCEFD7;--warn:#B67A12;--warn-soft:#F6E7C4;--crit:#B23A2E;--crit-soft:#F4D8D2;--info:#206E8C;--info-soft:#D3E7EE;--shadow:0 1px 2px rgba(11,58,63,.06),0 8px 26px rgba(11,58,63,.07);}
  :root[data-theme="dark"]{--bg:#091514;--surface:#0F2321;--surface-2:#15302D;--surface-3:#0C1D1B;--ink:#E9F1EA;--ink-soft:#B6C6BD;--muted:#7E9088;--line:#22403C;--line-strong:#2F5450;--brand:#57BD4C;--brand-ink:#7ED073;--brand-soft:#16351F;--deep:#0B3A3F;--deep-2:#123F45;--copper:#D98A54;--copper-soft:#3A2415;--ok:#57BD4C;--ok-soft:#16351F;--warn:#D9A63C;--warn-soft:#3A2E10;--crit:#E0685A;--crit-soft:#3A1A15;--info:#4FA6C4;--info-soft:#0F2E38;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);--shadow-lg:0 24px 60px rgba(0,0,0,.55);}

  *{box-sizing:border-box}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .wrap{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  .container{max-width:1180px;margin:0 auto;padding:0 20px}
  h1,h2,h3,h4{margin:0}
  button{font-family:inherit}
  .tnum{font-variant-numeric:tabular-nums}
  .spacer{flex:1}

  /* ---------- suite bar ---------- */
  .appbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
  .appbar-in{display:flex;align-items:center;gap:14px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.01em;white-space:nowrap;cursor:pointer;background:none;border:none;color:var(--ink);padding:0;font-size:15px}
  .brand .mk{width:26px;height:26px}
  .brand small{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left}
  .tools{display:flex;gap:3px;margin-left:10px;overflow-x:auto}
  .tools button{border:none;background:transparent;color:var(--ink-soft);font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tools button:hover{background:var(--surface-2);color:var(--ink)}
  .tools button.active{background:var(--brand-soft);color:var(--brand-ink)}
  .icon-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .icon-btn:hover{border-color:var(--brand)}
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{border-color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
  .btn.danger:hover{background:var(--crit-soft);border-color:var(--crit)}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  main{padding:26px 0 70px}

  /* ---------- shared bits ---------- */
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.5;white-space:nowrap}
  .pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.ok{background:var(--ok-soft);color:var(--brand-ink)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.crit{background:var(--crit-soft);color:var(--crit)}
  .pill.info{background:var(--info-soft);color:var(--info)}
  .pill.copper{background:var(--copper-soft);color:var(--copper)}
  .pill.muted{background:var(--surface-2);color:var(--muted)}
  .avatar{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 auto}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .card-h h3{font-size:15px}
  .card-h .sub{color:var(--muted);font-size:12.5px}
  .card-b{padding:18px}
  .page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .page-head h2{font-size:22px;letter-spacing:-.02em}
  .page-head .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty .e-ic{font-size:34px;margin-bottom:10px}
  .note{font-size:12px;color:var(--muted);font-style:italic}
  .banner{background:var(--brand-soft);color:var(--brand-ink);border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:18px;display:flex;align-items:center;gap:10px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--deep);color:#EAF4E9;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:80;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .scrollx{overflow-x:auto}

  /* ---------- HUB landing ---------- */
  .hero{position:relative;overflow:hidden;border-radius:18px;margin-bottom:26px;border:1px solid var(--line)}
  .hero-bg{position:absolute;inset:0;background:
    radial-gradient(120% 90% at 88% -10%,color-mix(in srgb,var(--brand) 30%,transparent),transparent 55%),
    radial-gradient(90% 70% at 6% 120%,color-mix(in srgb,var(--copper) 22%,transparent),transparent 55%),
    linear-gradient(180deg,var(--deep),var(--deep-2))}
  .ridge{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:70px;display:block}
  .hero-in{position:relative;z-index:2;padding:44px 34px 66px}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:#CFE9CC;font-weight:700;margin-bottom:16px}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 30%,transparent)}
  .hero h1{font-size:clamp(26px,4.2vw,40px);line-height:1.06;color:#F4FBF2;letter-spacing:-.025em;font-weight:750;margin-bottom:12px;max-width:18ch;text-wrap:balance}
  .hero p{color:#D5E7D6;max-width:58ch;margin:0 0 20px;font-size:15.5px}
  .hero-stats{display:flex;flex-wrap:wrap;gap:9px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#EAF4E9;font-size:12px;font-weight:500}
  .chip b{color:#fff;font-weight:750}

  .tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:900px){.tgrid{grid-template-columns:1fr}}
  .tool-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:var(--shadow);cursor:pointer;transition:transform .14s,border-color .14s,box-shadow .14s;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .tool-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,var(--brand))}
  .tool-card:hover{transform:translateY(-3px);border-color:var(--tc,var(--brand));box-shadow:var(--shadow-lg)}
  .tool-card .tico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--tc,var(--brand)) 15%,transparent);color:var(--tc,var(--brand));margin-bottom:14px}
  .tool-card h3{font-size:17px;letter-spacing:-.01em;margin-bottom:5px}
  .tool-card .td{color:var(--ink-soft);font-size:13.5px;flex:1;margin-bottom:14px}
  .tool-card .tstats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .tool-card .tgo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;color:var(--tc,var(--brand))}
  .soon{border-style:dashed;cursor:default;opacity:.72;box-shadow:none}
  .soon:hover{transform:none;box-shadow:none;border-color:var(--line)}
  .soon::before{background:var(--line-strong)}

  /* ---------- sub tabs ---------- */
  .subtabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;margin-bottom:20px;flex-wrap:wrap}
  .subtabs button{border:none;background:transparent;color:var(--ink-soft);font-weight:650;font-size:13px;padding:7px 14px;border-radius:7px;cursor:pointer}
  .subtabs button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  /* ---------- kpis ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  @media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow)}
  .kpi .n{font-size:30px;font-weight:780;letter-spacing:-.02em;line-height:1}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:7px}
  .kpi.b .n{color:var(--brand)}.kpi.w .n{color:var(--warn)}.kpi.c .n{color:var(--copper)}.kpi.r .n{color:var(--crit)}.kpi.i .n{color:var(--info)}

  /* ---------- radar ---------- */
  .radar{display:flex;flex-direction:column;gap:10px}
  .radar-item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .12s,transform .12s}
  .radar-item:hover{border-color:var(--brand);transform:translateY(-1px)}
  .radar-item.hot{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn-soft) 35%,var(--surface))}
  .cd{width:56px;height:56px;border-radius:12px;display:grid;place-content:center;text-align:center;background:var(--surface-3);border:1px solid var(--line)}
  .cd .d{font-size:19px;font-weight:800;line-height:1}
  .cd .u{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .cd.hot{background:var(--warn-soft);border-color:var(--warn)}.cd.hot .d{color:var(--warn)}
  .cd.live{background:var(--brand-soft);border-color:var(--brand)}.cd.live .d{color:var(--brand-ink);font-size:11px}
  .radar-main .who{font-weight:650;font-size:14px;display:flex;align-items:center;gap:8px}
  .radar-main .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .radar-main .meta b{color:var(--ink-soft);font-weight:650}
  .radar-st{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  @media(max-width:640px){.radar-item{grid-template-columns:auto 1fr}.radar-st{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:flex-start}}

  /* ---------- gantt ---------- */
  .gantt-tools{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .yearsel{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
  .yearsel button{border:none;background:transparent;color:var(--ink);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px}
  .yearsel button:hover{background:var(--surface-2)}
  .yearsel .y{font-weight:750;padding:0 6px;font-size:14px}
  .gantt{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
  .gantt-inner{min-width:900px}
  .g-months{display:grid;grid-template-columns:210px 1fr;border-bottom:1px solid var(--line);background:var(--surface-3)}
  .g-months .lbl{padding:10px 14px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .g-months .mrow{display:grid;grid-template-columns:repeat(12,1fr)}
  .g-months .mrow span{text-align:center;padding:10px 2px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;border-left:1px solid var(--line)}
  .g-months .mrow span.now{color:#fff;background:var(--copper)}
  .g-row{display:grid;grid-template-columns:210px 1fr;border-bottom:1px solid var(--line)}
  .g-row:last-child{border-bottom:none}
  .g-name{padding:11px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:9px}
  .g-name .nm{font-weight:650;font-size:13px;line-height:1.15}
  .g-name .pf{font-size:10.5px;color:var(--muted);margin-top:1px}
  .g-track{position:relative;min-height:50px;background-image:repeating-linear-gradient(90deg,transparent,transparent calc(8.333% - 1px),var(--line) calc(8.333% - 1px),var(--line) 8.333%)}
  .g-now{position:absolute;top:0;bottom:0;width:2px;background:var(--copper);z-index:3}
  .g-now::after{content:"HOY";position:absolute;top:2px;left:3px;font-size:8px;font-weight:800;color:var(--copper);letter-spacing:.05em}
  .g-bar{position:absolute;top:11px;height:28px;border-radius:7px;display:flex;align-items:center;gap:5px;padding:0 8px;font-size:11px;font-weight:650;color:#fff;white-space:nowrap;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.16);cursor:pointer;z-index:2}
  .g-bar:hover{filter:brightness(1.06)}
  .g-bar .rv{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;font-size:8px;font-weight:800}
  .bar-vac{background:linear-gradient(180deg,var(--brand),var(--brand-ink))}
  .bar-des{background:linear-gradient(180deg,var(--info),#155a73)}
  .bar-lic{background:linear-gradient(180deg,var(--copper),#8f4d22)}
  .bar-cap{background:linear-gradient(180deg,#6a5aa8,#4a3d80)}
  .legend{display:flex;flex-wrap:wrap;gap:15px;margin-top:14px;font-size:12px;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:13px;height:13px;border-radius:4px;display:block}

  /* ---------- table ---------- */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line)}
  .tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tbody tr{cursor:pointer}
  .tbl tbody tr:hover{background:var(--surface-3)}
  .tbl .who{display:flex;align-items:center;gap:9px;font-weight:600}
  .cell-mono{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(6,20,20,.55);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
  .modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:680px;margin:auto}
  .modal.wide{max-width:840px}
  .modal-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:16px 16px 0 0;z-index:2}
  .modal-h h3{font-size:16px}
  .modal-h .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .modal-b{padding:20px}
  .modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .modal-f .left{margin-right:auto}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;background:var(--surface-3);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;color:var(--ink);font-family:inherit}
  .field textarea{min-height:88px;resize:vertical;line-height:1.5}
  .field .hint{font-size:11px;color:var(--muted);margin-top:5px;font-style:italic}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:560px){.fgrid,.fgrid3{grid-template-columns:1fr}}
  .sec-lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);font-weight:750;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  .sec-lbl::after{content:"";flex:1;height:1px;background:var(--line)}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.detail-grid{grid-template-columns:1fr}}
  .kv{background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .kv .k{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kv .v{font-size:14px;font-weight:600;margin-top:3px;display:flex;align-items:center;gap:8px}
  .acc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .acc-row:last-child{border-bottom:none}
  .acc-row .an{font-weight:600;font-size:13.5px}
  .acc-row .ao{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .cyc{cursor:pointer;border:none;background:transparent;padding:0}
  .chk-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .ring{--p:0;width:56px;height:56px;flex:0 0 auto;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;position:relative}
  .ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
  .ring b{position:relative;z-index:1;font-size:13px;font-weight:800}
  .chk-cat{margin-bottom:14px}
  .chk-cat .ct{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:750;margin-bottom:7px;display:flex;align-items:center;gap:8px}

var KEY="suite-pmo-antamina-v1";
var DB;
function load(){try{var r=localStorage.getItem(KEY);if(r){DB=JSON.parse(r);if(!DB.transcripciones)DB.transcripciones=seedTranscripciones();return;}}catch(e){}DB=seed();save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function reset(){DB=seed();save();}

/* ============ lookups & rules ============ */
function consultores(){return DB.consultores.filter(function(c){return c.rol==="Consultor";});}
function byId(id){for(var i=0;i<DB.consultores.length;i++)if(DB.consultores[i].id===id)return DB.consultores[i];return null;}
function ausencia(id){for(var i=0;i<DB.ausencias.length;i++)if(DB.ausencias[i].id===id)return DB.ausencias[i];return null;}
function minuta(id){for(var i=0;i<DB.minutas.length;i++)if(DB.minutas[i].id===id)return DB.minutas[i];return null;}
function chkPct(a){if(!a.checklist||!a.checklist.length)return 0;var t=0,d=0;a.checklist.forEach(function(c){c.items.forEach(function(i){t++;if(i.done)d++;});});return t?Math.round(d/t*100):0;}
function accesosOtorgados(a){if(!a.accesos||!a.accesos.length)return 0;return a.accesos.filter(function(x){return x.estado==="otorgado";}).length;}
function accesosOk(a){return !!(a.accesos&&a.accesos.length&&a.accesos.every(function(x){return x.estado==="otorgado";}));}
function esCorta(a){return diasHab(a.fechaInicio,a.fechaFin)<=3;}
function estadoRelevo(a){
  if(a.estado==="Cerrada")return{k:"cerrada",label:"Cerrada",pill:"muted"};
  if(!a.relevoId)return (esCorta(a)&&a.tipo!=="vacaciones")?{k:"ligera",label:"Cobertura ligera",pill:"info"}:{k:"sinrelevo",label:"Sin relevo",pill:"crit"};
  if(accesosOk(a)&&chkPct(a)>=DB.cfg.umbral)return{k:"lista",label:"Lista para relevo",pill:"ok"};
  return{k:"prep",label:"En preparación",pill:"warn"};
}
function ordenadas(){return DB.ausencias.slice().sort(function(a,b){return pd(a.fechaInicio)-pd(b.fechaInicio);});}
function proximas(){var t=today();return ordenadas().filter(function(a){return pd(a.fechaFin)>=t;});}
function compromisosAbiertos(){
  var out=[];
  DB.minutas.forEach(function(m){(m.compromisos||[]).forEach(function(c){if(c.estado!=="hecho")out.push({c:c,m:m});});});
  return out.sort(function(x,y){return pd(x.c.fecha||"2999-01-01")-pd(y.c.fecha||"2999-01-01");});
}
function portafolios(){var s=[];consultores().forEach(function(c){if(s.indexOf(c.portafolio)<0)s.push(c.portafolio);});return s;}

/* ============ VACACIONES ============ */
function posPct(s,end){
  var d=pd(s),y=state.year;
  if(d.getFullYear()<y)return 0;
  if(d.getFullYear()>y)return 100;
  var m=d.getMonth(),day=d.getDate(),frac=(end?day:(day-1))/dim(y,m);
  return((m+frac)/12)*100;
}

function actaTexto(m){
  var L=[];
  L.push("ACTA DE REUNIÓN — "+m.titulo);
  L.push("".padEnd(60,"="));
  L.push("Código: "+m.id);
  L.push("Fecha: "+fmtL(m.fecha)+"   Hora: "+(m.hora||"—"));
  L.push("Modalidad: "+(m.modalidad||"—")+"   Lugar: "+(m.lugar||"—"));
  L.push("Portafolio: "+(m.portafolio||"—"));
  L.push("");
  L.push("ASISTENTES");
  (m.asistentes||[]).forEach(function(a){L.push("  - "+a.nombre+(a.rol?" ("+a.rol+")":""));});
  L.push("");
  L.push("AGENDA");
  (m.agenda||[]).forEach(function(a,i){L.push("  "+(i+1)+". "+a);});
  L.push("");
  L.push("ACUERDOS");
  (m.acuerdos||[]).forEach(function(a){L.push("  - "+a);});
  L.push("");
  L.push("COMPROMISOS");
  (m.compromisos||[]).forEach(function(c){
    L.push("  - "+c.desc+" | Responsable: "+(c.responsable||"—")+" | Fecha: "+(c.fecha||"—")+" | Estado: "+cmpEstado(c.estado)[1]);
  });
  if(m.notas){L.push("");L.push("NOTAS");L.push("  "+m.notas);}
  L.push("");
  L.push("Generado por PMO Automa — Suite PMO Antamina");
  return L.join("\n");
}

  var asis=lines(document.getElementById("m-asi").value).map(function(l){
    var p=l.split(/\s+[—|-]\s+|\|/);return {nombre:(p[0]||"").trim(),rol:(p[1]||"").trim()};});
  var cmp=lines(document.getElementById("m-cmp").value).map(function(l){
    var p=l.split("|").map(function(x){return x.trim();});
    var old=prev&&(prev.compromisos||[]).filter(function(c){return c.desc===p[0];})[0];
    return {id:old?old.id:uid("cp"),desc:p[0]||"",responsable:p[1]||"",fecha:p[2]||"",estado:old?old.estado:"pendiente"};
  }).filter(function(c){return c.desc;});
  var obj={
    id:id||("M-"+today().getFullYear()+"-"+String(Math.floor(Math.random()*900)+100)),

function copiarActa(id){
  var t=actaTexto(minuta(id));
  function fb(){try{var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("Acta copiada");}catch(e){toast("No se pudo copiar aquí");}}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("Acta copiada");},fb);
    else fb();
  }catch(e){fb();}
}
function descargarActa(id){
  var m=minuta(id);
  try{
    var blob=new Blob([actaTexto(m)],{type:"text/plain;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=url;a.download="Acta_"+String(m.titulo||m.id).replace(/[^\w]+/g,"_")+".txt";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    toast("Acta descargada");
  }catch(e){toast("Descarga no disponible aquí — usa Copiar");}
}

function traerAcuerdosAbiertos(){
  var NL=String.fromCharCode(10);
  var pf=(document.getElementById("m-pf")||{}).value||"";
  var campo=document.getElementById("m-cmp"); if(!campo)return;
  var actual=campo.value||"";
  var abiertos=todosLosCompromisos().filter(function(x){
    return x.c.estado!=="hecho" && (!pf || x.m.portafolio===pf);});
  if(!abiertos.length){toast("No hay acuerdos abiertos en ese portafolio");return;}
  var existentes=actual.split(NL).map(function(l){return norm(l.split("|")[0]);});
  var nuevas=abiertos.map(function(x){
      return [x.c.desc,x.c.responsable||"",x.c.fecha||""].join(" | ");})
    .filter(function(l){return existentes.indexOf(norm(l.split("|")[0]))<0;});
  if(!nuevas.length){toast("Los acuerdos abiertos ya están incluidos");return;}
  campo.value=(actual.trim()?actual.trim()+NL:"")+nuevas.join(NL);
  toast("Añadidos "+nuevas.length+" acuerdo(s) abiertos del portafolio");
}
function correoMinuta(id){
  var m=minuta(id); if(!m)return;
  var NL=String.fromCharCode(13)+String.fromCharCode(10);
  var eml=["To: ","Subject: Minuta - "+m.titulo+" ("+fmtL(m.fecha)+")","X-Unsent: 1",
    "Content-Type: text/plain; charset=utf-8","",actaTexto(m)].join(NL);
  descargarTexto("Minuta_"+String(m.id)+".eml",eml,"message/rfc822");
}

/* ============ BUSQUEDA EN EL HISTORICO ============ */
var VACIAS=["que","como","para","por","los","las","del","una","uno","con","cual","cuales",
  "esta","este","hay","son","cuando","donde","quien","quienes","sobre","todos","todas"];
function textoDeMinuta(m){
  var NL=String.fromCharCode(10),L=[m.titulo||""];
  var asis=(m.asistentes||[]).map(function(a){return a.nombre+(a.rol?" ("+a.rol+")":"");});
  if(asis.length)L.push("Asistentes: "+asis.join(", "));
  if((m.agenda||[]).length)L.push("Agenda: "+m.agenda.join(" | "));
  if((m.acuerdos||[]).length)L.push("Acuerdos: "+m.acuerdos.join(" | "));
  if((m.compromisos||[]).length)L.push("Compromisos: "+m.compromisos.map(function(c){
    return c.desc+" -> "+(c.responsable||"sin responsable")+" ("+(c.fecha||"sin fecha")+")";}).join(" | "));
  if(m.notas)L.push("Notas: "+m.notas);
  return L.join(NL);
}
function buscarLocal(q){
  var toks=norm(q).split(/[^a-z0-9]+/).filter(function(t){return t.length>2&&VACIAS.indexOf(t)<0;});
  if(!toks.length)return [];
  var docs=[];
  (DB.minutas||[]).forEach(function(m){docs.push({id:m.id,tipo:"minuta",titulo:m.titulo,
    fecha:m.fecha,portafolio:m.portafolio,texto:textoDeMinuta(m)});});
  (DB.transcripciones||[]).forEach(function(t){docs.push({id:t.id,tipo:"transcripcion",titulo:t.titulo,
    fecha:t.fecha,portafolio:t.portafolio,texto:t.texto||""});});
  var out=[];
  docs.forEach(function(d){
    var nt=norm(d.texto+" "+d.titulo);
    var hits=toks.filter(function(t){return nt.indexOf(t)>=0;});
    if(!hits.length)return;
    var pos=Math.max(0,nt.indexOf(hits[0])-90);
    out.push({docId:d.id,tipo:d.tipo,titulo:d.titulo,fecha:d.fecha,portafolio:d.portafolio,
      extracto:(pos>0?"…":"")+(d.texto||"").substr(pos,240)+"…",score:hits.length});
  });
  out.sort(function(a,b){return b.score-a.score;});
  return out.slice(0,10);
}
function ejecutarBusqueda(){
  var q=((document.getElementById("q-hist")||{}).value||"").trim();
  state.busq.q=q;
  if(!q){state.busq.res=null;render();return;}
  if(API.on){
    state.busq.cargando=true;render();
    apiGet("/api/buscar?q="+encodeURIComponent(q)+"&limite=10").then(function(j){
      state.busq.res=j.resultados||[];state.busq.cargando=false;render();
    }).catch(function(){state.busq.res=buscarLocal(q);state.busq.cargando=false;render();});
    return;
  }
  state.busq.res=buscarLocal(q);render();
}

    '<button class="btn primary sm" data-tnew="1" style="margin-left:10px">＋ Nueva transcripción</button></div>'+

function matchProyectos(nq){
  return DB.proyectos.filter(function(p){
    var n=norm(p.nombre);
    if(nq.indexOf(n)>=0)return true;
    var toks=n.split(/[^a-z0-9]+/).filter(function(w){return w.length>4;});
    return toks.some(function(w){return nq.indexOf(w)>=0;});
  });
}
function matchPortafolio(nq){
  var found=null;
  portafolios().forEach(function(p){
    var n=norm(p);
    if(nq.indexOf(n)>=0){found=p;return;}
    var toks=n.split(/[^a-z0-9]+/).filter(function(w){return w.length>4;});
    if(toks.some(function(w){return nq.indexOf(w)>=0;}))found=p;
  });
  return found;
}
function matchConsultor(nq){
  var f=null;
  DB.consultores.forEach(function(c){
    norm(c.nombre).split(" ").forEach(function(w){if(w.length>3&&nq.indexOf(w)>=0)f=c;});
  });
  return f;
}

function responder(q){
  var nq=norm(q);
  var proy=matchProyectos(nq),port=matchPortafolio(nq),cons=matchConsultor(nq);
  if(/\b(hola|buenas|ayuda|que puedes|qué puedes|gracias)\b/.test(nq))return ansAyuda();
  if(/vacacion|ausenc|relevo|cubre|cubrir|descanso|licencia/.test(nq))return ansAusencias(nq,cons);
  if(/compromiso|acuerdo|tarea|accion|pendiente/.test(nq))return ansCompromisos(proy,port);
  if(/riesg/.test(nq))return ansRiesgos(proy,port);
  if(/hito|milestone|entregable/.test(nq))return ansHitos(proy,port);
  if(/presupuesto|capex|costo|budget|inversion/.test(nq))return ansPresupuesto(proy,port);
  if(/rojo|critico|en riesgo|retras|semaforo|atrasad/.test(nq))return ansSemaforo("rojo");
  if(/ambar|amarillo/.test(nq))return ansSemaforo("ambar");
  if(/avance|progreso|porcentaje/.test(nq))return ansAvance(proy,port);
  if(proy.length===1)return ansProyecto(proy[0]);
  if(proy.length>1&&!port)return '<p>Encontré varios proyectos que coinciden:</p><div>'+proy.map(proyRow).join("")+'</div><p class="mini" style="margin-top:8px">Pregúntame por uno en concreto.</p>';
  if(port)return ansPortafolio(port);
  if(cons)return ansAusencias(nq,cons);
  if(/como van|resumen|general|todos|estado|proyecto|portafolio/.test(nq))return ansResumen();
  return ansFallback();
}

function mdToHtml(t){
  var s=esc(t||"");s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  var out=[],lst=[];
  s.split(/\n/).forEach(function(ln){
    var m=ln.match(/^\s*[-*•]\s+(.*)$/);
    if(m){lst.push("<li>"+m[1]+"</li>");}
    else{if(lst.length){out.push("<ul>"+lst.join("")+"</ul>");lst=[];}if(ln.trim())out.push("<p>"+ln+"</p>");}

function buildMessages(q,histSource){

function fetchChat(messages,maxTok,extra){
  var ctrl=new AbortController(),to=setTimeout(function(){ctrl.abort();},95000);
  var cuerpo={messages:messages,max_tokens:maxTok||1200,temperature:0.3};
  if(extra)for(var k in extra)cuerpo[k]=extra[k];
  return fetch(LLM.chatUrl||"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(cuerpo),signal:ctrl.signal})
    .then(function(r){clearTimeout(to);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(j){if(j.error)throw new Error(j.error);return j;});
}
function checkBackend(){
  var cands=[{h:"/api/health",ch:"/api/chat",mode:"servidor",api:true}];
  if(PROXY_URL){var p=PROXY_URL;while(p.charAt(p.length-1)==="/")p=p.slice(0,-1);
    cands.push({h:p+"/health",ch:p+"/chat",mode:"nube",api:false});}
  (function probar(i){
    if(i>=cands.length){LLM.on=false;API.on=false;render();return;}
    var ctrl=new AbortController(),to=setTimeout(function(){ctrl.abort();},4000);
    fetch(cands[i].h,{signal:ctrl.signal}).then(function(r){clearTimeout(to);if(!r.ok)throw new Error("x");return r.json();})
    .then(function(j){
      if(j&&j.ok){
        LLM.on=true;LLM.chatUrl=cands[i].ch;LLM.model=j.model;LLM.mode=cands[i].mode;
        API.on=!!cands[i].api;API.stats=j.db||null;
        if(API.on)cargarDeServidor();else render();
      }else probar(i+1);
    }).catch(function(){clearTimeout(to);probar(i+1);});
  })(0);
}

function seccionIA(txt,name){
  // Extrae los items de una seccion del acta que devuelve la IA (AGENDA / ACUERDOS /
  // COMPROMISOS). Se analiza linea por linea para tolerar negritas, numeracion y viñetas.
  var NL=String.fromCharCode(10), VINETA=String.fromCharCode(8226);
  var VINETAS=["-","*",VINETA,String.fromCharCode(8211),String.fromCharCode(8212)];
  var CABECERAS=["AGENDA","ACUERDOS","COMPROMISOS","NOTAS","ASISTENTES","PARTICIPANTES","RESUMEN","OBJETIVO"];
  var lineas=String(txt||"").split(NL), objetivo=String(name||"").toUpperCase();
  var out=[], dentro=false;
  function quitarFormato(x){
    while(x.length&&"*#> ".indexOf(x.charAt(0))>=0)x=x.slice(1);
    return x;
  }
  for(var i=0;i<lineas.length;i++){
    var L=lineas[i].trim();
    if(!L)continue;
    var cab=null, plana=quitarFormato(norm(L).toUpperCase());
    for(var j=0;j<CABECERAS.length;j++){
      if(plana.indexOf(CABECERAS[j])===0){cab=CABECERAS[j];break;}
    }
    if(cab){dentro=(cab===objetivo);continue;}
    if(!dentro)continue;
    L=quitarFormato(L);
    if(L.length&&VINETAS.indexOf(L.charAt(0))>=0)L=L.slice(1).trim();
    else{
      var k=0;while(k<L.length&&L.charAt(k)>="0"&&L.charAt(k)<="9")k++;
      if(k>0&&k<L.length&&(L.charAt(k)==="."||L.charAt(k)===")"))L=L.slice(k+1).trim();
    }
    L=L.split("**").join("").trim();
    if(L)out.push(L);
  }
  return out;
}

  if(d.genacc){var a3=ausencia(d.genacc);a3.accesos=accesosTpl(byId(a3.consultorId).portafolio);save();toast("Accesos generados");renderModal();return;}
  if(d.genchk){var a4=ausencia(d.genchk);a4.checklist=chkTpl();save();toast("Checklist generado");renderModal();return;}
  if(d.saverel){
    var ar=ausencia(d.saverel),relv=document.getElementById("d-relevo").value||null;
    var respv=document.getElementById("d-resp").value||null,limv=document.getElementById("d-lim").value||null;
    var had=ar.relevoId;ar.relevoId=relv;ar.responsablePmo=respv;ar.fechaLimiteAccesos=limv;
    if(relv&&!had&&!ar.accesos.length)ar.accesos=accesosTpl(byId(ar.consultorId).portafolio);
    if(relv&&!had&&!ar.checklist.length)ar.checklist=chkTpl();
    save();toast(relv?"Relevo guardado":"Relevo removido");renderModal();return;
  }
  /* minutas */
  if(d.mnew!=null){state.modal={type:"mform",id:null};renderModal();return;}
  if(d.mopen){state.modal={type:"mview",id:d.mopen};renderModal();return;}
  if(d.medit){state.modal={type:"mform",id:d.medit};renderModal();return;}
  if(d.mdel){DB.minutas=DB.minutas.filter(function(m){return m.id!==d.mdel;});save();
    if(API.on)apiPost("/api/minutas/eliminar",{id:d.mdel}).then(refrescarStats).catch(function(){});
    state.modal=null;toast("Minuta eliminada");render();return;}
  if(el.hasAttribute("data-msave")){saveMinuta(el.getAttribute("data-msave")||null);return;}
  if(el.hasAttribute("data-cfil")){state.cfiltro=el.getAttribute("data-cfil");render();return;}
  if(d.cexp!=null){exportarCompromisosCSV();return;}
  if(d.mcarry!=null){traerAcuerdosAbiertos();return;}
  if(d.mmail){correoMinuta(d.mmail);return;}
  if(d.pnew!=null){state.modal={type:"proy",id:null};renderModal();return;}
  if(d.popen){state.modal={type:"proy",id:d.popen};renderModal();return;}
  if(el.hasAttribute("data-psave")){guardarProyecto(el.getAttribute("data-psave")||null);return;}
  if(d.pdel){borrarProyecto(d.pdel);return;}
  if(el.hasAttribute("data-pfil")){state.pfiltro=el.getAttribute("data-pfil");render();return;}
  if(d.tnew!=null){state.modal={type:"tform"};renderModal();return;}
  if(d.topen){abrirTranscripcion(d.topen);return;}
  if(d.tsave!=null){guardarTranscripcion();return;}
  if(d.tdel){borrarTranscripcion(d.tdel);return;}
  if(d.tmin){minutaDesdeTranscripcion(d.tmin);return;}
  if(d.mtab){state.mtab=d.mtab;render();return;}
  if(d.buscar!=null){ejecutarBusqueda();return;}
  if(d.hit){abrirResultado(d.hit);return;}
  if(d.mai!=null){iaMinuta();return;}
  if(d.mcopy){copiarActa(d.mcopy);return;}
  if(d.mdown){descargarActa(d.mdown);return;}
  if(d.ccyc){
    var r=d.ccyc.split("|"),mm=minuta(r[0]);
    var cc=(mm.compromisos||[]).filter(function(x){return x.id===r[1];})[0];
    if(cc){cc.estado=({pendiente:"curso",curso:"hecho",hecho:"pendiente"})[cc.estado];save();
      if(API.on)apiPost("/api/compromiso",{minutaId:mm.id,id:cc.id,estado:cc.estado}).catch(function(){});
      if(state.modal)renderModal();else render();}
    return;
  }
  /* asistente */
  if(d.ask){preguntar(d.ask);return;}
  if(d.send!=null){var inp=document.getElementById("ai-input");if(inp){preguntar(inp.value);}return;}
});
document.addEventListener("change",function(e){
  if(e.target&&e.target.hasAttribute&&e.target.hasAttribute("data-cresp")){
    state.cresp=e.target.value;render();
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&state.modal){state.modal=null;render();return;}
  if(e.key==="Enter"&&e.target&&e.target.id==="ai-input"){preguntar(e.target.value);}
  if(e.key==="Enter"&&e.target&&e.target.id==="q-hist"){ejecutarBusqueda();}
});

load();
render();
checkBackend();

  matchPortafolio:matchPortafolio,matchConsultor:matchConsultor,hubHTML:hubHTML,minuta:minuta,ausencia:ausencia,
  getDB:function(){return DB;},state:state,setTool:function(t){state.tool=t;render();},
  mdToHtml:mdToHtml,contextoPMO:contextoPMO,buildMessages:buildMessages,
  buscarLocal:buscarLocal,textoDeMinuta:textoDeMinuta,seedTranscripciones:seedTranscripciones,
